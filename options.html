<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>폰트 오버라이드 - 제외 목록</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    max-width: 560px;
    margin: 32px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p.desc { color: #555; font-size: 13px; line-height: 1.6; }
  .add-row { display: flex; gap: 8px; margin: 18px 0; }
  .add-row input {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }
  .add-row button {
    padding: 9px 16px;
    border: none;
    border-radius: 6px;
    background: #1a56b0;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border: 1px solid #eee;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  li button {
    border: none;
    background: #ffe1e1;
    color: #b3261e;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .empty { color: #999; font-size: 13px; padding: 14px 0; }
</style>
</head>
<body>
  <h1>Pretendard + D2Coding 폰트 — 적용 제외 사이트</h1>
  <p class="desc">
    여기에 추가한 도메인과 그 하위 도메인에서는 폰트 오버라이드가 적용되지 않고
    원래 사이트 폰트가 그대로 유지됩니다. 글꼴이 깨져 보이는 사이트를 추가하세요.<br>
    도메인만 입력하면 됩니다 (예: notion.so). 전체 주소를 붙여넣어도 도메인만 자동으로 추출합니다.
  </p>
  <div class="add-row">
    <input type="text" id="domainInput" placeholder="example.com">
    <button id="addBtn">추가</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">제외된 사이트가 없습니다. 모든 페이지에 폰트가 적용됩니다.</div>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
